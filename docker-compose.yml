services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: banana_backend_api
    ports:
      - "8000:8000"
    environment:
      - FASTAPI_HOST=0.0.0.0
      - FASTAPI_PORT=8000
      - MODEL_PATH=/app/models/production_model.pt
      - TRACKING_URI=sqlite:////app/mlflow.db
    volumes:
      - ./models:/app/models
      - ./data/production_logs:/app/data/production_logs
      - ./reports:/app/reports
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: banana_frontend_ui
    ports:
      - "8501:8501"
    environment:
      - FASTAPI_URL=http://backend:8000
    volumes:
      - ./reports:/app/reports:ro
      - ./models:/app/models:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  default:
    name: banana_mlops_network
