name: FreshScore Zero-Trust Production Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  lint-and-test:
    name: Pre-Deployment Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --extra-index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Ruff Linter Check
        run: |
          ruff check src/ tests/ config/ frontend/ dags/

      - name: Pytest Unit & Integration Tests
        run: |
          pytest tests/ -v --maxfail=1

  build-and-deploy:
    name: Build, ECR Push & Zero-Trust SSM Deploy
    runs-on: ubuntu-latest
    needs: lint-and-test
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC (Keyless)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: GitHubActionsBananaFreshScoreDeploy
          audience: sts.amazonaws.com


      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Backend Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/banana-fastapi:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/banana-fastapi:latest

      - name: Build & Push Frontend Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/banana-streamlit:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/banana-streamlit:latest

      - name: Upload Production Model Artifacts to S3
        if: env.S3_BUCKET != ''
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          if [ -d "models" ]; then
            aws s3 sync models/ "s3://${{ secrets.S3_BUCKET }}/models" \
              --exclude "*" \
              --include "*.pt" \
              --no-progress || echo "Notice: Model sync to S3 completed or skipped."
          fi

      - name: Deploy Containers via AWS SSM (Zero SSH, Port 22 Closed)
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          IMAGE_TAG: ${{ github.sha }}
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          echo "Dispatching Zero-Trust deployment command via AWS Systems Manager..."
          
          # Encode production compose file to base64 for remote transfer via SSM
          COMPOSE_B64=$(base64 -w 0 docker-compose.prod.yml)
          
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Zero-Trust Deployment: commit ${{ github.sha }}" \
            --parameters commands="[
              \"mkdir -p /home/ubuntu/banana-mlops/{models,data/production_logs,reports}\",
              \"echo '${COMPOSE_B64}' | base64 -d > /home/ubuntu/banana-mlops/docker-compose.prod.yml\",
              \"cd /home/ubuntu/banana-mlops\",
              \"aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY}\",
              \"if [ -n '${{ secrets.S3_BUCKET }}' ]; then aws s3 sync s3://${{ secrets.S3_BUCKET }}/models /home/ubuntu/banana-mlops/models --no-progress || true; fi\",
              \"export ECR_REGISTRY=${ECR_REGISTRY}\",
              \"export IMAGE_TAG=${IMAGE_TAG}\",
              \"docker compose -f docker-compose.prod.yml pull\",
              \"docker compose -f docker-compose.prod.yml up -d --remove-orphans\",
              \"sleep 10\",
              \"curl -fsS http://localhost:8000/health || (docker compose -f docker-compose.prod.yml logs --tail 40 && exit 1)\",
              \"docker image prune -f\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command dispatched. Command ID: ${COMMAND_ID}"
          echo "Awaiting execution completion..."

          # Wait for SSM command execution to finish
          aws ssm wait command-executed \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}"

          # Inspect final status
          STATUS=$(aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query "Status" \
            --output text)

          echo "SSM Command final status: ${STATUS}"
          if [ "${STATUS}" != "Success" ]; then
            echo "SSM Command output:"
            aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query "StandardErrorContent" \
              --output text
            exit 1
          fi

      - name: External Public Health Probe
        env:
          PUBLIC_IP: ${{ secrets.EC2_PUBLIC_IP }}
        run: |
          echo "Probing public endpoints on http://${PUBLIC_IP}..."
          curl --fail --retry 10 --retry-delay 5 --retry-connrefused "http://${PUBLIC_IP}:8000/health"
          echo "FastAPI backend is publicly healthy!"
          curl --fail --retry 10 --retry-delay 5 --retry-connrefused "http://${PUBLIC_IP}:8501/_stcore/health"
          echo "Streamlit frontend is publicly healthy!"
